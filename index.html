<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крашенинников Дмитрий Владимирович | Визитная карточка</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 480px;
            width: 100%;
            padding: 36px 28px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .avatar-placeholder {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .title {
            color: var(--accent);
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .company {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .contacts {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .contact-item:hover {
            border-color: var(--accent);
            background-color: rgba(56, 189, 248, 0.08);
            color: var(--accent);
        }

        .location {
            font-size: 13px;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            padding-top: 20px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar-placeholder">ДК</div>
        <h1>Крашенинников Дмитрий Владимирович</h1>
        <div class="title">Старший юрисконсульт</div>
        <div class="company">АО «Водоканал «Павшино»</div>

        <div class="contacts">
            <a href="tel:+79265791276" class="contact-item">
                📞 +7 (926) 579-12-76
            </a>
            <a href="mailto:vk_pavshino@mail.ru" class="contact-item">
                ✉️ vk_pavshino@mail.ru
            </a>
        </div>

        <div class="location">
            Московская область, г. Красногорск,<br>ул. Ленина, д. 62
        </div>
    </div>

</body>
</html>
